<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Lies Detector for Headlines</title>
  <style>
    :root {
      --bg-1: #070b1a;
      --bg-2: #0f1734;
      --card: rgba(16, 24, 52, 0.78);
      --border: rgba(133, 155, 255, 0.25);
      --text: #e9eeff;
      --muted: #a9b5df;
      --primary: #7aa2ff;
      --accent: #5df2d6;
      --warning: #ffc768;
      --danger: #ff6d88;
      --success: #4be39d;
      --shadow: 0 20px 50px rgba(1, 7, 20, 0.55);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 15%, #1b2a63 0%, transparent 35%),
                  radial-gradient(circle at 80% 0%, #17335f 0%, transparent 42%),
                  linear-gradient(145deg, var(--bg-1), var(--bg-2));
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: min(980px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      padding: clamp(20px, 4vw, 36px);
      position: relative;
      overflow: hidden;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 24px;
      padding: 1px;
      background: linear-gradient(140deg, rgba(122, 162, 255, 0.45), rgba(93, 242, 214, 0.2), rgba(255, 109, 136, 0.3));
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.2rem);
      letter-spacing: 0.02em;
      text-shadow: 0 0 20px rgba(122, 162, 255, 0.35);
    }

    .subtitle {
      margin-top: 10px;
      color: var(--muted);
      font-size: clamp(1rem, 2.2vw, 1.15rem);
      max-width: 760px;
      line-height: 1.45;
    }

    .input-row {
      margin-top: 24px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
    }

    input[type="text"] {
      width: 100%;
      border: 1px solid rgba(132, 156, 255, 0.35);
      background: rgba(10, 17, 38, 0.9);
      color: var(--text);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 1rem;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(122, 162, 255, 0.15);
    }

    button {
      border: none;
      background: linear-gradient(135deg, #80a6ff, #61f1d7);
      color: #0a1130;
      font-weight: 700;
      border-radius: 14px;
      padding: 14px 18px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 20px rgba(97, 241, 215, 0.22);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(97, 241, 215, 0.27);
    }

    .samples {
      margin-top: 26px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .sample-btn {
      width: 100%;
      text-align: left;
      color: #dbe6ff;
      font-weight: 500;
      background: rgba(15, 25, 58, 0.78);
      border: 1px solid rgba(127, 162, 255, 0.2);
      box-shadow: none;
      padding: 12px 13px;
    }

    .sample-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(127, 162, 255, 0.45);
      box-shadow: 0 10px 20px rgba(20, 35, 90, 0.4);
    }

    .results {
      margin-top: 28px;
      background: rgba(6, 13, 30, 0.72);
      border: 1px solid rgba(118, 152, 255, 0.22);
      border-radius: 16px;
      padding: 18px;
      opacity: 0;
      transform: translateY(8px);
      max-height: 0;
      overflow: hidden;
      transition: all 0.35s ease;
    }

    .results.visible {
      opacity: 1;
      transform: translateY(0);
      max-height: 900px;
    }

    .verdict {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .meter + .meter {
      margin-top: 12px;
    }

    .meter-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 0.95rem;
      color: #d9e5ff;
    }

    .bar {
      width: 100%;
      height: 11px;
      border-radius: 999px;
      background: rgba(114, 133, 189, 0.25);
      overflow: hidden;
    }

    .bar-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .credibility { background: linear-gradient(90deg, #4be39d, #84ffd0); }
    .manipulation { background: linear-gradient(90deg, #ffc768, #ff8f69); }
    .clickbait { background: linear-gradient(90deg, #ff7ea1, #ff5e7b); }

    .explanations {
      margin: 15px 0 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.45;
    }

    .hint {
      margin-top: 10px;
      color: #9bb0e7;
      font-size: 0.9rem;
    }

    @media (max-width: 720px) {
      body { padding: 14px; }
      .input-row { grid-template-columns: 1fr; }
      .samples { grid-template-columns: 1fr; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>AI Lies Detector</h1>
    <p class="subtitle">Analyze whether a headline looks credible, manipulative, or clickbait</p>

    <div class="input-row">
      <input id="headlineInput" type="text" placeholder="Paste or type a headline here..." autocomplete="off" />
      <button id="analyzeBtn" type="button">Analyze Headline</button>
    </div>

    <section class="samples" aria-label="Sample headlines">
      <button class="sample-btn" type="button">Scientists at Oxford publish new study on sleep and memory</button>
      <button class="sample-btn" type="button">YOU WON'T BELIEVE what this CEO said about AI!!!</button>
      <button class="sample-btn" type="button">This one fruit is secretly destroying your body</button>
      <button class="sample-btn" type="button">New report shows rent prices rose 12% in major cities</button>
      <button class="sample-btn" type="button">They don't want you to know this retirement trick</button>
      <button class="sample-btn" type="button">Can eating late at night really harm your health?</button>
    </section>

    <section id="results" class="results" aria-live="polite">
      <div id="verdict" class="verdict"></div>

      <div class="meter">
        <div class="meter-head"><span>Credibility Score</span><strong id="credValue">0</strong></div>
        <div class="bar"><div id="credBar" class="bar-fill credibility"></div></div>
      </div>

      <div class="meter">
        <div class="meter-head"><span>Manipulation Score</span><strong id="manValue">0</strong></div>
        <div class="bar"><div id="manBar" class="bar-fill manipulation"></div></div>
      </div>

      <div class="meter">
        <div class="meter-head"><span>Clickbait Score</span><strong id="clickValue">0</strong></div>
        <div class="bar"><div id="clickBar" class="bar-fill clickbait"></div></div>
      </div>

      <ul id="explanations" class="explanations"></ul>
      <p class="hint">Rule-based analysis only (no external AI/API calls).</p>
    </section>
  </main>

  <script>
    // Core phrase banks for quick rule-based scoring.
    const emotionalWords = ["shocking", "terrifying", "outrageous", "secret", "exposed", "banned"];
    const vaguePhrases = [
      "they don't want you to know",
      "this changes everything",
      "you won't believe"
    ];
    const sourceTerms = ["study", "report", "university", "data", "researchers"];
    const absolutistTerms = ["always", "never", "everyone", "nobody"];

    const inputEl = document.getElementById("headlineInput");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const sampleButtons = document.querySelectorAll(".sample-btn");

    const resultsEl = document.getElementById("results");
    const verdictEl = document.getElementById("verdict");
    const credValueEl = document.getElementById("credValue");
    const manValueEl = document.getElementById("manValue");
    const clickValueEl = document.getElementById("clickValue");
    const credBarEl = document.getElementById("credBar");
    const manBarEl = document.getElementById("manBar");
    const clickBarEl = document.getElementById("clickBar");
    const explanationsEl = document.getElementById("explanations");

    /** Clamp value into 0-100 range. */
    function clampScore(value) {
      return Math.max(0, Math.min(100, Math.round(value)));
    }

    /** Main analysis function - easy to expand with extra rules later. */
    function analyzeHeadline(headline) {
      const text = headline.trim();
      const lowerText = text.toLowerCase();
      const words = text.split(/\s+/).filter(Boolean);

      let credibility = 50;
      let manipulation = 20;
      let clickbait = 20;
      let uncertainty = 0;

      const reasons = [];

      // Rule: ALL CAPS words increase manipulation and clickbait.
      const allCapsWords = words.filter((word) => /[A-Z]{3,}/.test(word) && word === word.toUpperCase());
      if (allCapsWords.length > 0) {
        manipulation += 10 + allCapsWords.length * 4;
        clickbait += 8 + allCapsWords.length * 4;
        credibility -= 6 + allCapsWords.length * 2;
        reasons.push("Contains ALL CAPS emphasis");
      }

      // Rule: excessive punctuation increases clickbait.
      const excessivePunctuation = (text.match(/([!?])\1+/g) || []).length;
      if (excessivePunctuation > 0) {
        clickbait += 14 + excessivePunctuation * 5;
        manipulation += 4 + excessivePunctuation * 2;
        credibility -= 6;
        reasons.push("Uses excessive punctuation for dramatic effect");
      }

      // Rule: emotional words increase manipulation.
      const matchedEmotionalWords = emotionalWords.filter((word) => lowerText.includes(word));
      if (matchedEmotionalWords.length > 0) {
        manipulation += 12 + matchedEmotionalWords.length * 6;
        clickbait += 6 + matchedEmotionalWords.length * 2;
        credibility -= 8;
        reasons.push("Uses emotionally loaded language");
      }

      // Rule: vague phrases increase manipulation.
      const matchedVaguePhrases = vaguePhrases.filter((phrase) => lowerText.includes(phrase));
      if (matchedVaguePhrases.length > 0) {
        manipulation += 15 + matchedVaguePhrases.length * 7;
        clickbait += 8 + matchedVaguePhrases.length * 3;
        credibility -= 12;
        reasons.push("Relies on vague phrasing");
      }

      // Rule: specific numbers increase credibility.
      const hasSpecificNumber = /\b\d+(?:[.,]\d+)?%?\b/.test(text);
      if (hasSpecificNumber) {
        credibility += 12;
        clickbait -= 3;
        reasons.push("Includes a specific number");
      }

      // Rule: source mentions boost credibility.
      const matchedSourceTerms = sourceTerms.filter((term) => lowerText.includes(term));
      if (matchedSourceTerms.length > 0) {
        credibility += 10 + matchedSourceTerms.length * 3;
        manipulation -= 6;
        reasons.push("References source-oriented terms");
      }

      // Rule: very short headlines increase uncertainty.
      if (words.length < 5) {
        uncertainty += 12;
        credibility -= 8;
        reasons.push("Very short headline increases uncertainty");
      }

      // Rule: absolutist terms reduce credibility.
      const matchedAbsolutes = absolutistTerms.filter((term) => lowerText.includes(term));
      if (matchedAbsolutes.length > 0) {
        credibility -= 10 + matchedAbsolutes.length * 4;
        manipulation += 8;
        reasons.push("Uses absolutist language");
      }

      // Rule: question headline slightly increases clickbait.
      if (text.endsWith("?")) {
        clickbait += 7;
        reasons.push("Framed as a question, which can be clickbait-prone");
      }

      // Blend uncertainty into scores.
      if (uncertainty > 0) {
        manipulation += Math.round(uncertainty * 0.3);
        clickbait += Math.round(uncertainty * 0.2);
      }

      credibility = clampScore(credibility);
      manipulation = clampScore(manipulation);
      clickbait = clampScore(clickbait);

      const verdict = deriveVerdict(credibility, manipulation, clickbait);

      return {
        credibility,
        manipulation,
        clickbait,
        verdict,
        reasons: reasons.slice(0, 3)
      };
    }

    /** Decide a simple verdict label from final scores. */
    function deriveVerdict(credibility, manipulation, clickbait) {
      if (credibility >= 68 && manipulation < 45 && clickbait < 45) {
        return "Likely Credible";
      }
      if (clickbait >= 68) {
        return "High Clickbait Risk";
      }
      if (manipulation >= 62 && clickbait < 68) {
        return "Possibly Manipulative";
      }
      return "Mixed Signals";
    }

    /** Render result panel with subtle animation. */
    function renderResults(result) {
      verdictEl.textContent = result.verdict;
      credValueEl.textContent = result.credibility;
      manValueEl.textContent = result.manipulation;
      clickValueEl.textContent = result.clickbait;

      const verdictColorMap = {
        "Likely Credible": "var(--success)",
        "Possibly Manipulative": "var(--warning)",
        "High Clickbait Risk": "var(--danger)",
        "Mixed Signals": "#c6d4ff"
      };
      verdictEl.style.color = verdictColorMap[result.verdict] || "#c6d4ff";

      explanationsEl.innerHTML = "";
      const fallbackReasons = [
        "Language appears relatively neutral",
        "Limited dramatic cues were detected",
        "Some signals remain uncertain"
      ];
      const reasons = result.reasons.length > 0 ? result.reasons : fallbackReasons;

      reasons.forEach((reason) => {
        const li = document.createElement("li");
        li.textContent = reason;
        explanationsEl.appendChild(li);
      });

      resultsEl.classList.add("visible");

      // Restart bar animation for repeated analyses.
      [credBarEl, manBarEl, clickBarEl].forEach((bar) => {
        bar.style.width = "0%";
      });

      requestAnimationFrame(() => {
        credBarEl.style.width = `${result.credibility}%`;
        manBarEl.style.width = `${result.manipulation}%`;
        clickBarEl.style.width = `${result.clickbait}%`;
      });
    }

    function runAnalysis() {
      const headline = inputEl.value.trim();
      if (!headline) {
        inputEl.focus();
        return;
      }
      const result = analyzeHeadline(headline);
      renderResults(result);
    }

    analyzeBtn.addEventListener("click", runAnalysis);
    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter") runAnalysis();
    });

    // Clickable sample headlines for quick demo interaction.
    sampleButtons.forEach((button) => {
      button.addEventListener("click", () => {
        inputEl.value = button.textContent;
        runAnalysis();
      });
    });
  </script>
</body>
</html>
